# Песочница Byte: драйвер PostgreSQL подключается не по сети, а к PostgreSQL внутри программы (PGlite).
socketFactory=dev.byteide.bridge.postgres.PgliteSocketFactory
# Вход без пароля (PGlite принимает любой). Значения по умолчанию избавляют драйвер от поиска ~/.pgpass
# и имени пользователя ОС — ни то ни другое в песочнице недоступно.
user=postgres
password=postgres
