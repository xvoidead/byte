spring:
  application:
    name: byte
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

byte:
  runner:
    timeout: 5s
    max-memory-mb: 128
    max-output-bytes: 65536
    max-concurrent-runs: 4
