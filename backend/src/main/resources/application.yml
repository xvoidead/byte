spring:
  application:
    name: byte
  threads:
    virtual:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
      chain:
        enabled: true
        compressed: true

server:
  port: ${PORT:8080}
  # За обратным прокси (Caddy, nginx) включите native, чтобы видеть реальный IP клиентов:
  # SERVER_FORWARD_HEADERS_STRATEGY=native
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json,application/xml,text/html,text/css,text/javascript,application/javascript,image/svg+xml,text/plain,application/manifest+json
  shutdown: graceful

byte:
  site:
    base-url: ${BYTE_BASE_URL:}
    contact-email: ${BYTE_CONTACT_EMAIL:}
  runner:
    timeout: 5s
    cpu-limit: 5s
    interactive-timeout: 2m
    max-memory-mb: 128
    max-threads: 32
    max-output-chars: 65536
    max-concurrent-runs: 4
    max-interactive-sessions: 8
  limits:
    runs-per-minute: 30
    run-burst: 15
    compiles-per-minute: 150
    concurrent-runs-per-ip: 2
    max-request-bytes: 524288

logging:
  level:
    dev.byteide: INFO
